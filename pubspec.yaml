name: baheth
description: "الباحث الأكاديمي — Al-Bahith Academy Student App"
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # DI
  get_it: ^8.0.2

  # Navigation
  go_router: ^14.3.0

  # Utils
  dartz: ^0.10.1
  uuid: ^4.5.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_pdfview: ^1.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  youtube_player_flutter: ^9.1.3
  flutter_windowmanager_plus: ^1.0.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0

  # Push notifications
  firebase_core: ^4.4.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0

  # Apple App Store / Google Play purchases
  in_app_purchase: ^3.2.3
  in_app_purchase_storekit: ^0.4.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter:
  # CocoaPods is used for iOS plugins so Xcode does not resolve the generated
  # Flutter SPM package at its default iOS 13 target before Flutter can raise
  # it to the Firebase-required iOS 15 target.
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
     - assets/
